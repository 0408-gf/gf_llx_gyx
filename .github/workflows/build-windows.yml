name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest
      - name: Run end-to-end smoke test
        run: python -m scripts.smoke_test
      - name: Build single-file EXE
        run: pyinstaller football_jc_onefile.spec --clean --noconfirm
      - name: Verify EXE
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\FootballJCAssistant.exe")) {
            throw "dist\FootballJCAssistant.exe was not created"
          }
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: FootballJCAssistant-Windows
          path: dist/FootballJCAssistant.exe
          if-no-files-found: error

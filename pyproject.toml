[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "football-jc-assistant"
version = "0.1.0"
description = "Windows 足球比赛预测与中国竞彩足球分析工具"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.6", "openpyxl>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6"]

[project.scripts]
football-jc = "app.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*", "core*", "models*", "services*"]
